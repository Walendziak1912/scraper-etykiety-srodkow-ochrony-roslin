[project]
name = "scraper-etykiety-srodkow-ochrony-roslin"
version = "0.1.0"
description = "Etykiety, zezwolenia, pozwolenia i decyzje środków ochrony roślin zarejestrowanych w Polsce https://www.gov.pl/web/rolnictwo/etykiety-srodkow-ochrony-roslin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.13.0.92",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "scrapy>=2.14",
]

[project.scripts]
scrapy-etykiety = "src.scraper.runner:main"
etykiety-gui = "src.gui:run_gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
